  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Space+Mono:wght@700&display=swap">
  <style>
    :root { --bg:#F5F0E6; --paper:#FFFDF7; --ink:#151515; --lime:#C7FF3D; --red:#E8381B; --muted:#6B655A; }
    * { box-sizing:border-box; font-synthesis:none; }
    body { background:var(--bg); color:var(--ink); margin:0; font-family:-apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .wrap { max-width:560px; margin:0 auto; padding:36px max(16px, env(safe-area-inset-right)) 56px max(16px, env(safe-area-inset-left)); display:flex; flex-direction:column; gap:22px; }
    .kicker { font-family:"Space Mono", monospace; font-size:13px; letter-spacing:.14em; }
    h1 { font-family:"Black Han Sans", sans-serif; font-weight:400; font-size:clamp(38px, 9vw, 56px); line-height:1.05; margin:0; }
    h1 mark { background:var(--lime); color:var(--ink); padding:0 .12em; }
    .player { border:4px solid var(--ink); box-shadow:8px 8px 0 var(--ink); background:var(--ink); aspect-ratio:9/16; width:min(100%, 420px); align-self:center; }
    .player video { display:block; width:100%; height:100%; object-fit:contain; }
    .meta { display:flex; flex-wrap:wrap; gap:8px; }
    .meta span { font-family:"Space Mono", monospace; font-size:12px; border:2px solid var(--ink); padding:5px 9px; background:var(--paper); }
    p { margin:0; font-size:16px; line-height:1.65; }
    .btn { display:inline-flex; font-family:"Black Han Sans", sans-serif; font-size:22px; color:var(--ink); background:var(--lime); border:3px solid var(--ink); box-shadow:5px 5px 0 var(--ink); padding:14px 22px; text-decoration:none; align-self:flex-start; }
    .btn:hover { transform:translate(-2px,-2px); box-shadow:7px 7px 0 var(--ink); }
    .btn:focus-visible { outline:3px solid var(--red); outline-offset:3px; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="kicker">BONE CLUB · FIND YOUR TANG.</div>
    <h1>감자탕 <mark>감별사</mark><br>홍보영상</h1>
    <div class="player">
      <video src="gamjatang-promo.mp4" controls playsinline preload="metadata" poster="poster.png"></video>
    </div>
    <div class="meta"><span>15초</span><span>세로 9:16</span><span>소리 있음 ▶ 눌러서 재생</span></div>
    <p>전국 감자탕집 649곳 지도, 감자탕 MBTI, 감자탕 월드컵, 도장깨기까지. 감자탕 탐험을 게임처럼 즐기는 사이트를 15초에 담았어요.</p>
    <a class="btn" href="../">사이트 바로가기 →</a>
  </main>
</body>
</html>
